<header class="site-header">
  <a class="brand" href="#top" aria-label="Hélder Badim, home"><span>HB</span></a>
  <nav [class.open]="menuOpen()" aria-label="Main navigation">
    <a href="#work" [class.active]="activeSection() === 'work'"
      [attr.aria-current]="activeSection() === 'work' ? 'location' : null"
      (click)="activateSection('work')">Projects</a>
    <a href="#experience" [class.active]="activeSection() === 'experience'"
      [attr.aria-current]="activeSection() === 'experience' ? 'location' : null"
      (click)="activateSection('experience')">Experience</a>
    <a href="#about" [class.active]="activeSection() === 'about'"
      [attr.aria-current]="activeSection() === 'about' ? 'location' : null" (click)="activateSection('about')">About</a>
  </nav>
  <div class="header-actions">
    <button class="theme-toggle" (click)="theme.toggle()"
      [attr.aria-label]="theme.isDark() ? 'Use light theme' : 'Use dark theme'"
      [attr.title]="theme.isDark() ? 'Use light theme' : 'Use dark theme'">{{ theme.isDark() ? '☼' : '◐' }}</button>
    <a class="contact-link" href="mailto:helderbadim@hotmail.com">Let’s talk <span>↗</span></a>
    <button class="menu-toggle" (click)="menuOpen.set(!menuOpen())" aria-label="Toggle menu">{{ menuOpen() ? '×' : '☰'
      }}</button>
  </div>
</header>
